# Prometheus 主配置（实际部署路径 /etc/prometheus/prometheus.yml）
# 核心作用：① 定义抓取任务（scrape_configs）② 挂载告警规则文件（rule_files）

global:
  scrape_interval: 15s          # 每 15 秒抓一次
  evaluation_interval: 15s      # 每 15 秒算一次告警规则

# ⚠️ 踩坑记录：这行下面如果前面留着 #，就变成注释，规则不会加载
rule_files:
  - "/etc/prometheus/rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
