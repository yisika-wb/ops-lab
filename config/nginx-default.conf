# 站点配置（实际部署路径 /etc/nginx/sites-available/default）
# 通过软链接挂到 /etc/nginx/sites-enabled/default 生效
#   草稿柜 sites-available  →  生效目录 sites-enabled
# 启停站点只需增删软链接，不用动配置内容本身。

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    server_name _;

    # 静态站点：按顺序找文件，找不到返回 404
    location / {
        try_files $uri $uri/ =404;
    }

    # 反向代理：把 /app/ 的请求转给后端服务
    # 后端只监听 127.0.0.1:8080，不直接对外暴露
    location /app/ {
        proxy_pass http://127.0.0.1:8080/;
    }
}
